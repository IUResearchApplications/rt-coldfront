<div
  class="modal fade"
  id="modifySearchModal"
  tabindex="-1"
  role="dialog"
  aria-labelledby="modifySearchModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modifySearchModalLabel">Modify Search</h2>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <form id="modifySearchForm" method="post" action="">
        <div class="modal-body"></div>
        <div class="modal-footer d-flex align-items-center">
          <div
            id="modify-search-message"
            class="alert d-none mb-0 flex-grow-1 mr-2"
            role="alert"
            style="width: auto"
          ></div>
          <div class="d-flex justify-content-end">
            <button type="submit" id="btn-submit-modify-search" class="btn btn-primary mr-2">
              Save
            </button>
            <button type="button" id="btn-delete-search" class="btn btn-danger mr-2">Delete</button>
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  function initSelect2() {
    $(".multiselect-wrapper select").select2({
      width: "100%",
    });
  }

  $(document).ready(function () {
    $(document).on("click", "#btn-modify-search", function () {
      const searchId = $(this).data("search-id");
      const $modal = $("#modifySearchModal");
      const $form = $("#modifySearchForm");
      const $msg = $("#modify-search-message");

      $msg.addClass("d-none").removeClass("alert-success alert-danger");
      $modal.modal("show");

      $.ajax({
        url: `/advanced_search/modify-search/${searchId}/`,
        type: "GET",
        success: function (data) {
          $form.attr("action", `/advanced_search/modify-search/${searchId}/`);
          $form.find(".modal-body").html(data);
          $modal.modal("show");
          initSelect2();
        },
        error: function () {
          $msg
            .removeClass("d-none")
            .addClass("alert-danger")
            .text("Failed to load search details.");
        },
      });
    });

    $(document).on("click", "#btn-delete-search", function () {
      const $form = $("#modifySearchForm");
      const actionUrl = $form.attr("action");
      if (!actionUrl) return;

      const searchId = actionUrl.split("/").filter(Boolean).pop();
      const $modal = $("#modifySearchModal");
      const $msg = $("#modify-search-message");

      if (!confirm("Are you sure you want to delete this saved search?")) {
        return;
      }

      $.ajax({
        url: `/advanced_search/delete-search/${searchId}/`,
        type: "DELETE",
        headers: { "X-CSRFToken": getCookie("csrftoken") },
        success: function (data) {
          $modal.modal("hide");
          // Optionally trigger a refresh of the saved searches list here
        },
        error: function () {
          $msg
            .removeClass("d-none")
            .addClass("alert-danger")
            .text("Failed to delete saved search.");
        },
      });
    });

    $("#modifySearchForm").on("submit", function (e) {
      e.preventDefault();
      const $form = $(this);
      const $msg = $("#modify-search-message");
      const $btn = $("#btn-submit-modify-search");

      $msg.addClass("d-none").removeClass("alert-success alert-danger");
      $btn.prop("disabled", true).text("Saving...");

      $.ajax({
        url: $form.attr("action"),
        type: "POST",
        data: $form.serialize(),
        headers: { "X-CSRFToken": getCookie("csrftoken") },
        success: function (data) {
          $msg.removeClass("d-none").addClass("alert-success").text(data.message);
          $btn.prop("disabled", false).text("Save");
        },
        error: function (xhr) {
          $msg.removeClass("d-none").addClass("alert-danger");
          let errorMessage = "Error updating search.";
          if (xhr.responseJSON && xhr.responseJSON.errors) {
            const firstField = Object.keys(xhr.responseJSON.errors)[0];
            errorMessage = xhr.responseJSON.errors[firstField][0];
          } else if (xhr.responseJSON && xhr.responseJSON.message) {
            errorMessage = xhr.responseJSON.message;
          }
          $msg.text(errorMessage);
          $btn.prop("disabled", false).text("Save");
        },
      });
    });
  });
</script>
