{% load static %}

<style>
  .scrollable-box {
    max-height: 150px;
    overflow-y: auto;
    border: 1px solid #dee2e6;
    padding: 0.5rem;
    border-radius: 0.25rem;
  }
  .multiselect-wrapper {
    margin-bottom: 1rem;
  }
  .multiselect-wrapper label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 500;
  }
</style>

<div
  class="modal fade"
  id="savedSearchModal"
  tabindex="-1"
  role="dialog"
  aria-labelledby="savedSearchModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="savedSearchModalLabel">Modal Title</h2>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body"></div>
      <div class="modal-footer">
        {% if created %}
          <div class="row w-100 justify-content-between align-items-center">
            <div class="col-auto">
              <small class="text-muted">
                Created: {{ created }}
                {% if not created == modified %}
                  <br>Last Updated: {{ modified }}
                {% endif %}
              </small>
            </div>
            <div class="col-auto">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
            </div>
          </div>
        {% endif %}
        <div id="modal-message" class="alert d-none mb-0 flex-grow-1 mr-2" role="alert" style="width: auto"></div>
        <div class="d-flex justify-content-end" id="modal-buttons"></div>
      </div>
    </div>
  </div>
</div>

<script>
  function initSelect2() {
    $(".multiselect-wrapper select").select2({
      width: "100%",
    });
  }

  $(document).ready(function () {
    let currentModalType = null;
    let currentSearchId = null;

    const modalConfig = {
      save: {
        title: "Save Search",
        footerButtons:
          '<button type="button" class="btn btn-secondary mr-2" data-dismiss="modal">Cancel</button>' +
          '<button type="submit" id="btn-submit-save-search" class="btn btn-primary">Save</button>',
      },
      modify: {
        title: "Modify Search",
        footerButtons:
          '<button type="submit" id="btn-submit-modify-search" class="btn btn-primary mr-2">Save</button>' +
          '<button type="button" id="btn-delete-search" class="btn btn-danger mr-2">Delete</button>' +
          '<button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>',
      },
      details: {
        title: "Search Details",
        footerButtons:
          '<button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>',
      },
    };

    function showModal(type, searchId = null) {
      const config = modalConfig[type];
      currentModalType = type;
      currentSearchId = searchId;

      const $modal = $("#savedSearchModal");
      const $modalTitle = $("savedSearchModalLabel");
      const $modalContent = $modal.find(".modal-content");
      const $modalBody = $modalContent.find(".modal-body");
      const $modalFooter = $modalContent.find(".modal-footer");
      const $messageContainer = $("#modal-message");
      const $buttonContainer = $("#modal-buttons");

      $messageContainer.addClass("d-none").removeClass("alert-success alert-danger");
      $messageContainer.text("");

      $modalTitle.text(config.title);
      $buttonContainer.html(config.footerButtons);
      $modalBody.empty();

      if (type === "save") {
        loadSaveForm($modalBody, $modalContent);
      } else if (type === "modify" && searchId) {
        loadModifyForm($modalBody, $modalContent, searchId);
      } else if (type === "details" && searchId) {
        loadDetailsContent($modalBody, $modalContent, searchId);
      }

      $modal.modal("show");
    }

    function loadSaveForm($modalBody, $modalContent) {     
      const $form = $(`<form id="saveSearchForm" method="post" action="/advanced_search/save-search/"></form>`);
      $modalContent.wrap($form);

      $.ajax({
        url: "/advanced_search/save-search/",
        type: "GET",
        success: function (data) {
          $modalBody.html(data);
          initSelect2();

          $("#hidden-query-data").val(JSON.stringify(window.filter_data));

          $form.on("submit", function (e) {
            const $submitBtn = $("#btn-submit-save-search");
            const url = $form.attr("action");
            const formData = $form.serialize();
            const $msg = $("#modal-message");

            $msg.addClass("d-none").removeClass("alert-success alert-danger");
            $msg.text("");
            $submitBtn.prop("disabled", true).text("Saving...");

            $.ajax({
              headers: { "X-CSRFToken": getCookie("csrftoken") },
              type: "POST",
              url: url,
              data: formData,
              success: function (data) {
                $msg.removeClass("d-none").addClass("alert-success");
                $msg.text(data.message);
                $submitBtn.prop("disabled", false).text("Save");

                setTimeout(function () {
                  $("#savedSearchModal").modal("hide");
                }, 1500);
              },
              error: function (xhr) {
                $msg.removeClass("d-none").addClass("alert-danger");
                let errorMessage = "There was an issue saving your search.";
                
                if (xhr.responseJSON && xhr.responseJSON.form_html) {
                  $form.html(xhr.responseJSON.form_html);
                  $msg.text(xhr.responseJSON.message || errorMessage);
                } else if (xhr.responseJSON && xhr.responseJSON.errors) {
                  const firstField = Object.keys(xhr.responseJSON.errors)[0];
                  errorMessage = xhr.responseJSON.errors[firstField][0];
                  $msg.text(errorMessage);
                } else if (xhr.responseJSON && xhr.responseJSON.message) {
                  errorMessage = xhr.responseJSON.message;
                } else {
                  $msg.text(errorMessage);
                }
                $submitBtn.prop("disabled", false).text("Save");
              },
            });
          });
        },
        error: function () {
          $modalBody.html(
            '<div class="alert alert-danger">Failed to load form. Please try again.</div>'
          );
        },
      });
    }

    function loadModifyForm($modalBody, $modalContent, searchId) {
      const $form = $(`<form id="modifySearchForm" method="post" action="/advanced_search/modify-search/${searchId}/"></form>`);
      $modalContent.wrap($form);

      $.ajax({
        url: `/advanced_search/modify-search/${searchId}/`,
        type: "GET",
        success: function (data) {
          $modalBody.html(data);
          initSelect2();
        },
        error: function () {
          $modalBody.html(
            '<div class="alert alert-danger">Failed to load search details. Please try again.</div>'
          );
        },
      });
    }

    function loadDetailsContent($modalBody, $modalContent, searchId) {
      $.ajax({
        url: `/advanced_search/search-details/${searchId}/`,
        type: "GET",
        success: function (data) {
          $modalBody.html(data);
        },
        error: function () {
          $modalBody.html(
            '<div class="alert alert-danger">Failed to load search details. Please try again.</div>'
          );
        },
      });
    }

    window.showSavedSearchModal = showModal;

    $(document).on("click", "#btn-delete-search", function () {
      const $form = $("#modifySearchForm");
      const actionUrl = $form.attr("action");
      if (!actionUrl) return;

      const searchId = actionUrl.split("/").filter(Boolean).pop();

      if (!confirm("Are you sure you want to delete this saved search?")) {
        return;
      }

      const $msg = $("#modal-message");

      $.ajax({
        url: `/advanced_search/delete-search/${searchId}/`,
        type: "DELETE",
        headers: { "X-CSRFToken": getCookie("csrftoken") },
        success: function (data) {
          $("#savedSearchModal").modal("hide");
          $msg.removeClass("d-none").addClass("alert-success");
          $msg.text("Search deleted successfully.");
        },
        error: function () {
          $msg.removeClass("d-none").addClass("alert-danger");
          $msg.text("Failed to delete saved search.");
        },
      });
    });

    $(document).on("submit", "#modifySearchForm", function (e) {
      e.preventDefault();
      const $form = $(this);
      const $btn = $("#btn-submit-modify-search");
      const $msg = $("#modal-message");

      $msg.addClass("d-none").removeClass("alert-success alert-danger");
      $msg.text("");
      $btn.prop("disabled", true).text("Saving...");

      $.ajax({
        url: $form.attr("action"),
        type: "POST",
        data: $form.serialize(),
        headers: { "X-CSRFToken": getCookie("csrftoken") },
        success: function (data) {
          $msg.removeClass("d-none").addClass("alert-success").text(data.message);
          $btn.prop("disabled", false).text("Save");

          setTimeout(function () {
            $("#savedSearchModal").modal("hide");
          }, 1500);
        },
        error: function (xhr) {
          $msg.removeClass("d-none").addClass("alert-danger");
          let errorMessage = "Error updating search.";
          if (xhr.responseJSON && xhr.responseJSON.errors) {
            const firstField = Object.keys(xhr.responseJSON.errors)[0];
            errorMessage = xhr.responseJSON.errors[firstField][0];
          } else if (xhr.responseJSON && xhr.responseJSON.message) {
            errorMessage = xhr.responseJSON.message;
          }
          $msg.text(errorMessage);
          $btn.prop("disabled", false).text("Save");
        },
      });
    });
  });
</script>
