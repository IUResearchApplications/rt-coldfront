{% load static %}

<style>
  .scrollable-box {
    max-height: 150px;
    overflow-y: auto;
    border: 1px solid #dee2e6;
    padding: 0.5rem;
    border-radius: 0.25rem;
  }
  .multiselect-wrapper {
    margin-bottom: 1rem;
  }
  .multiselect-wrapper label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 500;
  }
  .summary-field-col {
    width: 40%;
  }
</style>

<div
  class="modal fade"
  id="savedSearchModal"
  tabindex="-1"
  role="dialog"
  aria-labelledby="savedSearchModalLabel"
  aria-hidden="true"
  data-url-save="{% url 'save-search' %}"
  data-url-modify="{% url 'modify-search' pk=0 %}"
  data-url-delete="{% url 'delete-search' pk=0 %}"
  data-url-details="{% url 'search-details' pk=0 %}"
  data-url-apply="{% url 'apply-saved-search' pk=0 %}"
  data-url-saved-list="{% url 'saved-searches' %}"
>
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <form id="saveSearchForm" method="post" action="">
        <div class="modal-header">
          <h2 class="modal-title" id="savedSearchModalLabel">Modal Title</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body"></div>
        <div class="modal-footer flex-nowrap">
          <div class="d-none alert flex-grow-1" id="modal-message" role="alert"></div>
          <div class="d-flex justify-content-end" id="modal-buttons"></div>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  function initSelect2() {
    $(".multiselect-wrapper select").select2({
      width: "100%",
      dropdownParent: $("#savedSearchModal")
    });
  }

  const SEARCH_TYPE_PREFIXES = {
    'project': { main: 'project_search', attr: 'projectattribute' },
    'allocation': { main: 'allocation_search', attr: 'allocationattribute' },
    'user': { main: 'user_search', attr: null }
  };

  const SUBMIT_VALUES = {
    'project': 'Project Search',
    'allocation': 'Allocation Search',
    'user': 'User Search'
  };

  document.addEventListener('DOMContentLoaded', function() {
    let currentModalType = null;

    function getUrl(name, id) {
      const template = $("#savedSearchModal").data("url-" + name);
      if (id == null) return template;
      // Replace the trailing <pk> segment. Anchoring to the end avoids
      // corrupting a "0" that may appear elsewhere in the URL prefix.
      return template.replace(/\/0\/$/, "/" + String(id) + "/");
    }

    const modalConfig = {
      save: {
        title: "Save Search",
        footerButtons:
          '<button type="submit" id="btn-submit-save-search" class="btn btn-primary me-2">Save</button>' +
          '<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>',
      },
      modify: {
        title: "Modify Search",
        footerButtons:
          '<button type="submit" id="btn-submit-save-search" class="btn btn-primary me-2">Save</button>' +
          '<button type="button" id="btn-delete-search" class="btn btn-danger me-2">Delete</button>' +
          '<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>',
      },
      update: {
        title: "Update Search",
        footerButtons:
          '<button type="submit" id="btn-submit-save-search" class="btn btn-primary me-2">Save</button>' +
          '<button type="button" id="btn-delete-search" class="btn btn-danger me-2">Delete</button>' +
          '<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>',
      },
      details: {
        title: "Search Details",
        footerButtons:
          '<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>',
      },
    };

    function showModal(type, searchId = null) {
      const config = modalConfig[type];
      currentModalType = type;

      const $modal = $("#savedSearchModal");
      const $modalTitle = $("#savedSearchModalLabel");
      const $modalContent = $modal.find(".modal-content");
      const $modalBody = $modalContent.find(".modal-body");
      const $messageContainer = $("#modal-message");
      const $buttonContainer = $("#modal-buttons");

      $messageContainer.addClass("d-none").removeClass("alert-success alert-danger");
      $messageContainer.text("");

      $modalTitle.text(config.title);
      $buttonContainer.html(config.footerButtons);
      $modalBody.empty();

      if (type === "details" && searchId) {
        loadDetailsContent($modalBody, $modalContent, searchId);
      } else {
        loadSaveForm($modalBody, $modalContent, searchId);
      }

      bootstrap.Modal.getOrCreateInstance($modal[0]).show();
    }

    function getSearchData() {
      // Get the active tab to determine search type
      const activeTab = $('.nav-tabs .nav-link.active').attr('href');
      let searchType = 'project';
      let mainFormData = {};
      let attributeFormData = {};

      if (activeTab === '#project-search') {
        searchType = 'project';
      } else if (activeTab === '#allocation-search') {
        searchType = 'allocation';
      } else if (activeTab === '#user-search') {
        searchType = 'user';
      }

      const prefixes = SEARCH_TYPE_PREFIXES[searchType];
      const mainFormPrefix = prefixes.main;
      const mainForm = $(activeTab + ' form');

      mainForm.find('input, select').each(function() {
        const $input = $(this);
        const name = $input.attr('name');
        if (name && name.startsWith(mainFormPrefix + '-')) {
          if (!name.includes('-TOTAL_FORMS') && !name.includes('-INITIAL_FORMS') &&
              !name.includes('-DELETE') && name !== mainFormPrefix + '-submit') {
            if ($input.is(':checkbox')) {
              if ($input.prop('checked')) {
                mainFormData[name] = '1';
              }
            } else if ($input.is(':radio')) {
              if ($input.prop('checked')) {
                mainFormData[name] = $input.val();
              }
            } else {
              mainFormData[name] = $input.val();
            }
          }
        }
      });

      mainFormData[mainFormPrefix + '-submit'] = SUBMIT_VALUES[searchType];

      // Collect attribute formset data
      if (searchType !== 'user' && prefixes.attr) {
        const attrPrefix = prefixes.attr;
        $(`[id*="${attrPrefix}_formset"] > div[id*="-attribute-row"]`).each(function(index) {
          $(this).find('input, select').each(function() {
            const $input = $(this);
            const name = $input.attr('name');
            if (name && name.includes(attrPrefix)) {
              // Parse the form index from the name attribute
              // e.g., projectattribute-0-attribute__name -> index 0, field attribute__name
              const match = name.match(new RegExp(`${attrPrefix}-(\\d+)-(\\w+(?:__\\w+)*)`));
              if (match) {
                const formIndex = match[1];
                const fieldName = match[2];
                const key = `${attrPrefix}-${formIndex}-${fieldName}`;

                if ($input.is(':checkbox')) {
                  if ($input.prop('checked')) {
                    attributeFormData[key] = '1';
                  }
                } else if ($input.is(':radio')) {
                  if ($input.prop('checked')) {
                    attributeFormData[key] = $input.val();
                  }
                } else {
                  attributeFormData[key] = $input.val();
                }
              }
            }
          });
        });
      }

      const queryData = {};
      if (searchType === 'project') {
        queryData.project_search = mainFormData;
        if (Object.keys(attributeFormData).length > 0) {
          queryData.project_attributes = attributeFormData;
        }
      } else if (searchType === 'allocation') {
        queryData.allocation_search = mainFormData;
        if (Object.keys(attributeFormData).length > 0) {
          queryData.allocation_attributes = attributeFormData;
        }
      } else if (searchType === 'user') {
        queryData.user_search = mainFormData;
      }

      return queryData;
    }

    function renderSearchSummary(queryData) {
      const fields = [];
      const isEmpty = function (v) {
        return v === '' || v === null || v === undefined ||
          (Array.isArray(v) && v.length === 0);
      };
      const pushField = function (name, value) {
        if (isEmpty(value)) return;

        const displayValue = Array.isArray(value) ? value.join(', ') : String(value);
        fields.push({ name: name, value: displayValue });
      };
      // Resolve a <select> field's value to the selected option text(s)
      // by reading from the on-page form (still in the DOM behind the modal).
      // Falls back to the raw value when the element is missing or not a
      // select.
      const resolveSelect = function (fullName, fallbackValue) {
        const $el = $('#id_' + fullName);
        if ($el.length && $el.is('select')) {
          const texts = $el.find('option:selected').map(function () {
            return $(this).text();
          }).get();
          if (texts.length) return texts.join(', ');
        }
        return fallbackValue;
      };

      Object.keys(queryData).forEach(function (sectionKey) {
        const section = queryData[sectionKey];
        if (!section || typeof section !== 'object' || Array.isArray(section)) return;

        if (sectionKey.endsWith('_attributes')) {
          // Group attribute fields by formset index and mirror the on-page
          // form: only surface usage fields when has_usage is enabled.
          const searchType = sectionKey.slice(0, -11); // strip '_attributes'
          const attrPrefix = (SEARCH_TYPE_PREFIXES[searchType] || {}).attr;
          const byIndex = {};
          Object.keys(section).forEach(function (name) {
            const parts = name.split('-');
            if (parts.length < 3) return;

            const idx = parts[1];
            const fieldName = parts.slice(2).join('-');
            if (!byIndex[idx]) byIndex[idx] = {};
            byIndex[idx][fieldName] = section[name];
          });
          Object.keys(byIndex).forEach(function (idx) {
            const attr = byIndex[idx];
            if (isEmpty(attr['attribute__name'])) return;

            let attrName = attr['attribute__name'];
            if (attrPrefix) {
              attrName = resolveSelect(attrPrefix + '-' + idx + '-attribute__name', attrName);
            }
            pushField('attribute__name', attrName);
            pushField('attribute__value', attr['attribute__value']);
            if (String(attr['attribute__has_usage']) === '1') {
              fields.push({ name: 'attribute__has_usage', value: 'True' });
              pushField('attribute__equality', attr['attribute__equality']);
              pushField('attribute__usage', attr['attribute__usage']);
              pushField('attribute__usage_format', attr['attribute__usage_format']);
            }
          });
        } else {
          Object.keys(section).forEach(function (name) {
            if (name.endsWith('-submit')) return;
            if (name.split('-').pop().indexOf('select_all') === 0) return;

            let value = section[name];
            if (isEmpty(value)) return;

            const cleanName = name.split('-').pop();
            if (cleanName.indexOf('display__') === 0) {
              value = String(value) === '1' ? 'True' : 'False';
            } else {
              value = resolveSelect(name, value);
            }
            pushField(cleanName, value);
          });
        }
      });

      if (fields.length === 0) return '';
      const escapeHtml = function (s) { return $('<div>').text(s).html(); };
      const rows = fields.map(function (f) {
        return '<tr><td><code>' + escapeHtml(f.name) + '</code></td><td>' + escapeHtml(f.value) + '</td></tr>';
      }).join('');
      return '<div class="mb-3">' +
        '<span class="fw-bold d-block mb-1">Search criteria being saved</span>' +
        '<div class="scrollable-box">' +
        '<table class="table table-sm table-bordered mb-0"><thead><tr><th class="summary-field-col">Field</th><th>Value</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>' +
        '</div>' +
        '</div>';
    }

    function loadSaveForm($modalBody, $modalContent, searchId) {
      let url = ""
      if (searchId) {
        url = getUrl("modify", searchId)
        if (currentModalType === "update") {
          url += "?update=1"
        }
      } else {
        url = getUrl("save")
      }
      $("#saveSearchForm").attr("action", url)

      $(document).off("submit", "#saveSearchForm").on("submit", "#saveSearchForm", function (e) {
        e.preventDefault();
        const $submitBtn = $("#btn-submit-save-search");
        const url = $(this).attr("action");

        if (currentModalType !== "modify") {
          const queryData = getSearchData();
          $("#hidden-query-data").val(JSON.stringify(queryData));
        }

        $submitBtn.prop("disabled", true).text("Saving...");

        $.ajax({
          headers: { "X-CSRFToken": "{{ csrf_token }}" },
          type: "POST",
          url: url,
          data: $(this).serialize(),
          success: function (data) {
            $submitBtn.prop("disabled", false).text("Save");
            if (data.success) {
              const $messageContainer = $("#modal-message");
              const $btnContainer = $("#modal-buttons");
              $messageContainer.removeClass("d-none").addClass("alert-success").text(data.message);
              $btnContainer.html('<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Done</button>')
              $.ajax({
                type: "GET",
                url: getUrl("saved-list"),
                success: function (data) {
                  $("#saved-searches").html(data);
                },
              });
            } else {
              const $messageContainer = $("#modal-message");
              let errorMessage = data.message || "There was an issue saving your search.";
              if (data.errors) {
                errorMessage = Object.values(data.errors).flat().join(', ');
              }
              $messageContainer.removeClass("d-none").addClass("alert-danger").text(errorMessage);
            }
          },
          error: function (xhr) {
            $submitBtn.prop("disabled", false).text("Save");
            const $messageContainer = $("#modal-message");
            let errorMessage = "Failed to save search.";
            if (xhr.responseJSON && xhr.responseJSON.message) {
              errorMessage = xhr.responseJSON.message;
            } else if (xhr.responseJSON && xhr.responseJSON.errors) {
              errorMessage = Object.values(xhr.responseJSON.errors).flat().join(', ');
            }
            $messageContainer.removeClass("d-none").addClass("alert-danger").text(errorMessage);
          },
        });
      });

      $.ajax({
        url: url,
        type: "GET",
        success: function (data) {
          $modalBody.html(data);
          initSelect2();
          if (currentModalType !== "modify") {
            const queryData = getSearchData();
            $("#hidden-query-data").val(JSON.stringify(queryData));
            const summaryHtml = renderSearchSummary(queryData);
            if (summaryHtml) {
              $modalBody.prepend(summaryHtml);
            }
          }
          const modifySearchName = $("#modify-search-name").text();
          if (modifySearchName && currentModalType === "modify") {
            $("#savedSearchModalLabel").empty().text("Updating saved search: " + modifySearchName);
          }
        },
        error: function () {
          $modalBody.html(
            '<div class="alert alert-danger">Failed to load form. Please try again.</div>'
          );
        },
      });
    }

    function loadDetailsContent($modalBody, $modalContent, searchId) {
      $.ajax({
        url: getUrl("details", searchId),
        type: "GET",
        success: function (data) {
          $modalBody.html(data);
        },
        error: function () {
          $modalBody.html(
            '<div class="alert alert-danger">Failed to load search details. Please try again.</div>'
          );
        },
      });
    }

    window.showSavedSearchModal = showModal;

    function showDeleteConfirmation() {
      $("#modal-message")
        .removeClass("d-none alert-success alert-danger")
        .addClass("alert-warning")
        .text("Are you sure you want to delete this saved search? This action cannot be undone.");
      $("#modal-buttons").html(
        '<button type="button" id="btn-confirm-delete-search" class="btn btn-danger me-2">Yes, delete</button>' +
        '<button type="button" id="btn-cancel-delete-search" class="btn btn-secondary">Cancel</button>'
      );
    }

    function restoreModalFooter() {
      const config = modalConfig[currentModalType];
      $("#modal-message")
        .addClass("d-none")
        .removeClass("alert-warning alert-success alert-danger")
        .text("");
      $("#modal-buttons").html(config.footerButtons);
    }

    function performDelete() {
      const $form = $("#saveSearchForm");
      const actionUrl = $form.attr("action");
      if (!actionUrl) return;

      const searchId = actionUrl.split("/").at(-2);
      const $msg = $("#modal-message");
      $("#btn-confirm-delete-search").prop("disabled", true).text("Deleting...");
      $("#btn-cancel-delete-search").prop("disabled", true);

      $.ajax({
        url: getUrl("delete", searchId),
        type: "POST",
        headers: { "X-CSRFToken": "{{ csrf_token }}" },
        success: function (data) {
          bootstrap.Modal.getInstance(document.getElementById("savedSearchModal")).hide();
          $.ajax({
            type: "GET",
            url: getUrl("saved-list"),
            success: function (data) {
              $("#saved-searches").html(data);
              const $banner = $("<div class='alert alert-success alert-dismissible fade show mb-3' role='alert'>" +
                "<i class='fas fa-check-circle me-2'></i>Search deleted successfully." +
                "<button type='button' class='btn-close' data-bs-dismiss='alert' aria-label='Close'></button></div>"
              );
              $("#accordion").before($banner);
              setTimeout(function() { $banner.fadeOut(); }, 4000);
            },
            error: function (xhr) {
              console.error('Failed to reload saved searches:', xhr);
            }
          });
        },
        error: function () {
          restoreModalFooter();
          $msg.removeClass("d-none").addClass("alert-danger").text("Failed to delete saved search.");
        },
      });
    }

    $(document).on("click", "#btn-delete-search", showDeleteConfirmation);
    $(document).on("click", "#btn-cancel-delete-search", restoreModalFooter);
    $(document).on("click", "#btn-confirm-delete-search", performDelete);
  });
</script>
