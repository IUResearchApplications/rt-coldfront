{% load crispy_forms_tags %}

<div
  class="modal fade"
  id="saveSearchModal"
  tabindex="-1"
  role="dialog"
  aria-labelledby="saveSearchModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="saveSearchModalLabel">Save Search</h2>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <form id="saveSearchForm" method="post" action="{% url 'save-search' %}">
        <div class="modal-body">
          {% csrf_token %}
          {{ save_search_form.name|as_crispy_field }}
          {{ save_search_form.description|as_crispy_field }}
          <div class="multiselect-wrapper">
            <label for="id_shared_with_users"> Select Users </label>
            {{ save_search_form.shared_with_users }}
            <label for="id_shared_with_groups"> Select Groups </label>
            {{ save_search_form.shared_with_groups }}
          </div>
          <input type="hidden" name="query_data" id="hidden-query-data" value="" />
        </div>
        <div class="modal-footer d-flex align-items-center">
          <div
            id="save-search-message"
            class="alert d-none mb-0 flex-grow-1 mr-2"
            role="alert"
            style="width: auto"
          ></div>
          <div class="d-flex justify-content-end">
            <button type="button" class="btn btn-secondary mr-2" data-dismiss="modal">
              Cancel
            </button>
            <button type="submit" id="btn-submit-save-search" class="btn btn-primary">Save</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  function initSelect2() {
    $(".multiselect-wrapper select").select2({
      width: "100%",
    });
  }

  $(document).ready(function () {
    initSelect2();

    $("#saveSearchModal").on("show.bs.modal", function () {
      initSelect2();
      const filterData = window.filter_data;
      $("#hidden-query-data").val(JSON.stringify(filterData));
    });

    $("#saveSearchForm").on("submit", function (e) {
      e.preventDefault();
      const $form = $(this);
      const url = $form.attr("action");
      const formData = $form.serialize();
      const $msgContainer = $("#save-search-message");
      const $submitBtn = $form.find('button[type="submit"]');

      $msgContainer.addClass("d-none").removeClass("alert-success alert-danger");
      $msgContainer.text("");
      $submitBtn.prop("disabled", true).text("Saving...");

      $.ajax({
        headers: { "X-CSRFToken": getCookie("csrftoken") },
        type: "POST",
        url: url,
        data: formData,
        success: function (data) {
          $msgContainer.removeClass("d-none").addClass("alert-success");
          $msgContainer.text(data.message);
          $submitBtn.prop("disabled", false).text("Save");
        },
        error: function (xhr) {
          $msgContainer.removeClass("d-none").addClass("alert-danger");
          let errorMessage = "There was an issue saving your search.";
          if (xhr.responseJSON && xhr.responseJSON.errors) {
            const firstField = Object.keys(xhr.responseJSON.errors)[0];
            errorMessage = xhr.responseJSON.errors[firstField][0];
          } else if (xhr.responseJSON && xhr.responseJSON.message) {
            errorMessage = xhr.responseJSON.message;
          }

          $msgContainer.text(errorMessage);
          $submitBtn.prop("disabled", false).text("Save");
        },
      });
    });
  });
</script>
