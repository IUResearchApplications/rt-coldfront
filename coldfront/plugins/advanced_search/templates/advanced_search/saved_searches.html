{% load common_tags %}
{% load crispy_forms_tags %}
{% load static %}

{% if user_saved_searches %}
  <div id="accordion-saved_searches" role="tablist">
    <div class="card mb-2">
      <div class="card-header" role="tab">
        <h5 class="mb-0">
          <a data-toggle="collapse" href="#all_saved_searches" aria-expanded="true" aria-controls="all_saved_searches">
            Saved Searches
          </a>
        </h5>
      </div>
      <div
        id="all_saved_searches"
        class="collapse show"
        role="tabpanel"
        aria-labelledby="all_saved_searches"
        data-parent="#accordion-saved_searches"
        style=""
      >
        <div class="card-body">
          <div class="row">
            {% for user_search in user_saved_searches %}
              <div class="col-md-4 mb-3">
                <div class="card">
                  <div class="card-header">
                    <h6 class="mb-0">{{ user_search.name }}</h6>
                  </div>
                  <div class="card-body">
                    {{ user_search.description }}
                  </div>
                  <div class="card-footer">
                    <div id="load-search-message-{{ user_search.pk }}">
                      <div></div>
                    </div>
                    <div class="d-flex justify-content-end">
                      <button type="button" id="btn-load-search" class="btn btn-success mr-2" data-search-id="{{ user_search.pk }}">Load</button>
                      <button type="button" id="btn-modify-search" class="btn btn-primary mr-2" data-search-id="{{ user_search.pk }}">Modify</button>
                      <button type="button" id="btn-details-search" class="btn btn-secondary" data-search-id="{{ user_search.pk }}">Details</button>
                    </div>
                  </div>
                </div>
              </div>
            {% endfor %}
          </div>
        </div>
      </div>
    </div>
  </div>
{% else %}
  <div class="alert alert-info" role="alert">
    <i class="fas fa-info-circle" aria-disabled="true"> No saved searches.
  </div>
{% endif %}
