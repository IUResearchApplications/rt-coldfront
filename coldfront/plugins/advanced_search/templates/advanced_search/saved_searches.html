{% load common_tags %}
{% load crispy_forms_tags %}
{% load static %}

<h2 class="h4">Saved Searches</h2>
<div id="all_saved_searches" class="card">
  <div class="card-body">
    {% if user_saved_searches %}
      <div class="row">
        {% for user_search in user_saved_searches %}
          <div class="col-md-4 mb-3">
            <div class="card">
              <div class="card-header">
                <h3 class="h6 mb-0">{{ user_search.name }}</h3>
              </div>
              <div class="card-body">
                {{ user_search.description }}
              </div>
              <div class="card-footer d-flex align-items-center">
                <div id="load-search-message-{{ user_search.pk }}">
                  <div></div>
                </div>
                <div class="d-flex justify-content-end">
                  <button type="button" id="btn-load-search" class="btn btn-success mr-2" data-search-id="{{ user_search.pk }}" data-url="{% url 'apply-saved-search' pk=user_search.pk %}">Load</button>
                  <button type="button" id="btn-modify-search" class="btn btn-primary mr-2" data-search-id="{{ user_search.pk }}">Modify</button>
                  <button type="button" id="btn-details-search" class="btn btn-secondary" data-search-id="{{ user_search.pk }}">Details</button>
                </div>
              </div>
            </div>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <div class="alert alert-info mb-0" role="alert">
        <i class="fas fa-info-circle" aria-disabled="true"></i> No saved searches.
      </div>
    {% endif %}
  </div>
</div>
