
<p><strong class="text-nowrap">Name:</strong> {{ name }}</p>
<p><strong class="text-nowrap">Owner:</strong> {{ owner }}</p>
<p><strong class="text-nowrap">Description:</strong> {{ description }}</p>
<div class="row mb-3">
  <div class="col">
    <span class="font-weight-bold">Shared with Users:</span>
    <div class="scrollable-box">
      <ul>
        {% for user in shared_with_users %}
          <li>{{ user }}</li>
        {% endfor %}
      </ul>
    </div>
  </div>
  <div class="col">
    <span class="font-weight-bold">Shared with Groups:<span/>
    <div class="scrollable-box">
      <ul>
        {% for group in shared_with_groups %}
          <li>{{ group }}</li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
<span class="font-weight-bold">Contents:</span>
<div class="scrollable-box">
  {{ raw_query_data }}
</div>
