{% extends "common/base.html" %}
{% load crispy_forms_tags %}
{% load common_tags %}
{% load static %}


{% block title %}
Add Resource Attribute
{% endblock %}


{% block content %}
<h1>Adding resource attribute to {{resource}}</h1>
<hr>

<form method="post">
  {% csrf_token %}
  {{form |crispy}}
  <button class="btn btn-success" type="submit">Add</button>
  <a class="btn btn-secondary" href="{% url 'resource-detail' resource.pk %}">Back to
    Resource</a><br>
</form>
{% endblock %}
