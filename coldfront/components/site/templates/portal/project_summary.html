{% load static %}
<div class="row" aria-labelledby="project-summary-header">
  <div class="col">
    <div
      id="projectTypes"
      style="min-height: 270px;"
      role="img"
      aria-label="Donut chart showing project type distribution"
      tabindex="0"
    ></div>
  </div>
  <div class="col">
    <div
      id="projectUsers"
      style="min-height: 270px;"
      role="img"
      aria-label="Donut chart showing project type user distribution"
      tabindex="0"
    ></div>
  </div>
</div>

{{ project_type_chart_data|json_script:"project_type_chart_data" }}
{{ project_user_chart_data|json_script:"project_user_chart_data" }}

<script>
  const project_type_chart_data = JSON.parse(document.getElementById('project_type_chart_data').textContent);
  const project_user_chart_data = JSON.parse(document.getElementById('project_user_chart_data').textContent);

  $(document).ready(function () {
    drawProjectTypes();
    drawProjectUsers();
  });

  function drawProjectTypes() {
    var chart = c3.generate({
      bindto: '#projectTypes',
      data: project_type_chart_data,
      donut: {
        title: "Project Types"
      },
      legend: {
        item: {
          onclick: function(id) { }
        }
      }
    });

    return chart;
  }

  function drawProjectUsers() {
    const chart = c3.generate({
      bindto: '#projectUsers',
      data: project_user_chart_data,
      donut: {
        title: "Project Users"
      },
      legend: {
        item: {
          onclick: function(id) { }
        }
      }
    })

    return chart;
  }
</script>
