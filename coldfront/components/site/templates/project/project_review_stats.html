{% load static %}
<div
  id="id_project_review_status_chart"
  style="min-height: 270px; width: 100%; max-width: 400px;"
  role="img"
  aria-label="Donut chart showing project review status distribution"
  tabindex="0"
></div>

{{ project_review_stats|json_script:"project_review_stats" }}

<script>
  // Avoids a redeclaration error if the chart is created more than once
  window.drawStats = function() {
    const chartData = JSON.parse(document.getElementById('project_review_stats').textContent);

    if (window.projectReviewChart) {
      window.projectReviewChart.destroy();
    }

    window.projectReviewChart = c3.generate({
      bindto: '#id_project_review_status_chart',
      donut: {
        title: "Project Statuses"
      },
      data: chartData,
      legend: {
        item: {
          onclick: function () { }
        }
      },
      size: {
        width: 350
      }
    });
  };
</script>
