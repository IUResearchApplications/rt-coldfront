{% extends "common/base.html" %}
{% load crispy_forms_tags %}
{% load static %}


{% block title %}
Update Project
{% endblock %}


{% block content %}
<h1>Update Project: {{ form.title.value }}</h1>

<form method="post">
  {% csrf_token %}
  {{ form|crispy }}
  <button class="btn btn-primary" type="submit">Save</button>
  <a class="btn btn-secondary" href="{% url 'project-detail' project_pk %}">Cancel</a>
</form>

<script>
  $("#navbar-main > ul > li.active").removeClass("active");
  $("#navbar-project-menu").addClass("active");
</script>
{% endblock %}
